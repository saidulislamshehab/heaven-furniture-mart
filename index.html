<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heaven Furniture Mart | Luxury & Bespoke Furniture Atelier — Chattogram</title>
    <meta name="description" content="Heaven Furniture Mart — Bespoke luxury furniture and architectural interior styling in Chattogram, Bangladesh. Designed around your space, crafted with noble materials." />
    <meta name="theme-color" content="#141F1E" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Heaven Furniture Mart" />
    <meta property="og:title" content="Heaven Furniture Mart — Bespoke Furniture & Interior Styling, Chattogram" />
    <meta property="og:description" content="Designed. Crafted. Customized. Bespoke luxury furniture and interior styling from Agrabad, Chattogram." />
    <meta property="og:image" content="/images/posters/hero-sofa.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Inner-page heroes load from the Unsplash CDN -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- Landing page only: pre-paint the intro's ivory backdrop so the dark body never flashes before React mounts,
         paint a caption so slow connections get a first contentful paint before the JS bundle lands (the intro removes it),
         and preload the hero poster so it is on screen the instant the curtain lifts. The first film buffers via its own
         <video preload="auto"> during the intro; `<link rel=preload as=video>` is unsupported in Chromium and only warns. -->
    <script>
      if (location.pathname === '/') {
        var s = document.createElement('style')
        s.id = 'intro-prepaint'
        s.textContent =
          'html,body{background:#F5F0EB !important}' +
          '#intro-premark{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:500 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:#875636;opacity:.85}'
        document.head.appendChild(s)
        var poster = document.createElement('link')
        poster.rel = 'preload'
        poster.as = 'image'
        poster.href = '/images/posters/hero-egg-chair.jpg'
        poster.fetchPriority = 'high'
        document.head.appendChild(poster)
        document.addEventListener('DOMContentLoaded', function () {
          var m = document.createElement('p')
          m.id = 'intro-premark'
          m.textContent = 'Heaven Furniture Mart · Chattogram'
          document.body.appendChild(m)
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
